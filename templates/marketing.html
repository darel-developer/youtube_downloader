<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Marketing IA</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-5">
    <div class="col-md-8 mx-auto">

        <h2 class="text-center mb-4">🚀 Générateur de contenu marketing IA</h2>

        <div class="mb-3">
            <textarea id="prompt" class="form-control" rows="4"
                placeholder="Ex: Donne-moi un texte de publication pour une PME dans le bâtiment..."></textarea>
        </div>

        <button onclick="generate()" class="btn btn-primary w-100">
            Générer
        </button>

        <div id="result" class="mt-4 p-3 bg-white border rounded d-none"></div>

    </div>
</div>

<script>
async function generate() {
    const prompt = document.getElementById("prompt").value;
    const resultDiv = document.getElementById("result");

    resultDiv.classList.remove("d-none");
    resultDiv.innerHTML = "⏳ Génération en cours...";

    try {
        const res = await fetch("/api/marketing/generate", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ prompt })
        });

        const data = await res.json();

        if (!res.ok) {
            throw new Error(data.error);
        }

        resultDiv.innerHTML = data.result;

    } catch (err) {
        resultDiv.innerHTML = "❌ Erreur : " + err.message;
    }
}
</script>

</body>
</html>
